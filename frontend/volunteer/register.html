<!DOCTYPE html>
<html>
<head>
  <title>Volunteer Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="overlay"></div>

<div class="auth-container">
  <h2>Volunteer Registration</h2>

  <form id="volunteerForm">

    <input type="text" placeholder="Full Name" id="volunteerName" required>
    <input type="text" placeholder="Gender" id="gender" required>
    <input type="text" placeholder="Phone Number" id="phone" required>
    <div id="phoneError" class="error-message"></div>
    <input type="email" placeholder="Email Address" id="email" required>
    <input type="password" placeholder="Password" id="password" required>
    <div id="passwordError" class="error-message"></div>
    <input type="password" placeholder="Confirm Password" id="confirmPassword" required>
    <div id="confirmPasswordError" class="error-message"></div>

    <select id="orgType" required onchange="showFields()">
      <option value="">Select Organization Type</option>
      <option value="NGO">NGO</option>
      <option value="NSS">NSS</option>
      <option value="Individual">Individual</option>
      <option value="Ashram">Ashram</option>
    </select>

    <div id="dynamicFields"></div>

    <button type="submit">Register</button>
  </form>

  <div id="message"></div>

  <p>Already registered?
    <a href="login.html">Login</a>
  </p>
</div>

<script>
function showFields() {
  const type = document.getElementById("orgType").value;
  const container = document.getElementById("dynamicFields");
  container.innerHTML = "";

  if (type === "NGO") {
    container.innerHTML = `
      <input type="text" id="ngoAddress" placeholder="NGO Address" required>
      <input type="text" id="ngoName" placeholder="NGO Name" required>
      <input type="text" id="ngoReg" placeholder="Volunteer ID / No" required>
    `;
  } else if (type === "NSS") {
    container.innerHTML = `
      <input type="text" id="nssAddress" placeholder="College Address" required>
      <input type="text" id="collegeName" placeholder="College Name" required>
      <input type="text" id="nssUnit" placeholder="NSS Unit Number" required>
    `;
  } else if (type === "Individual") {
    container.innerHTML = `
      <input type="text" id="resAddress" placeholder="Residential Address" required>
      <input type="text" id="aadhaar" placeholder="Aadhaar Number" required>
    `;
  } else if (type === "Ashram") {
    container.innerHTML = `
      <input type="text" id="ashramAddress" placeholder="Ashram Address" required>
      <input type="text" id="ashramName" placeholder="Ashram Name" required>
    `;
  }
}

document.getElementById("volunteerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const volunteerName = document.getElementById("volunteerName").value.trim();
  const gender = document.getElementById("gender").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const type = document.getElementById("orgType").value;
  const message = document.getElementById("message");

  let organizationDetails = "";

  // Clear previous error messages
  document.getElementById("phoneError").textContent = "";
  document.getElementById("passwordError").textContent = "";
  document.getElementById("confirmPasswordError").textContent = "";

  if (!volunteerName || !gender || !phone || !email || !password || !confirmPassword || !type) {
    message.innerHTML = '<div style="color: red; text-align: center;">Please enter all required volunteer details.</div>';
    return;
  }

  // Validate phone number - exactly 10 digits
  if (!/^\d{10}$/.test(phone)) {
    document.getElementById("phoneError").textContent = "❌ Phone number must be exactly 10 digits!";
    return;
  }

  // Validate password - minimum 6 characters and at least one special character
  if (password.length < 6) {
    document.getElementById("passwordError").textContent = "❌ Password must be at least 6 characters long!";
    return;
  }

  if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]/.test(password)) {
    document.getElementById("passwordError").textContent = "❌ Password must contain at least one special character!";
    return;
  }

  if (password !== confirmPassword) {
    document.getElementById("confirmPasswordError").textContent = "❌ Passwords do not match!";
    return;
  }

  if (type === "NGO") {
    organizationDetails = `
      Address: ${document.getElementById("ngoAddress")?.value || ""},
      NGO Name: ${document.getElementById("ngoName")?.value || ""},
      Reg No: ${document.getElementById("ngoReg")?.value || ""}
    `;
  }

  if (type === "NSS") {
    organizationDetails = `
      Address: ${document.getElementById("nssAddress")?.value || ""},
      College: ${document.getElementById("collegeName")?.value || ""},
      NSS Unit: ${document.getElementById("nssUnit")?.value || ""}
    `;
  }

  if (type === "Individual") {
    organizationDetails = `
      Address: ${document.getElementById("resAddress")?.value || ""},
      Aadhaar: ${document.getElementById("aadhaar")?.value || ""}
    `;
  }

  if (type === "Ashram") {
    organizationDetails = `
      Address: ${document.getElementById("ashramAddress")?.value || ""},
      Ashram Name: ${document.getElementById("ashramName")?.value || ""}
    `;
  }

  try {
    const res = await fetch("https://foodconnect3.onrender.com/api/volunteer/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: volunteerName,
        gender,
        phone,
        email,
        password,
        confirmPassword,
        organizationType: type,
        organizationDetails
      })
    });

    const data = await res.json();
    if (res.ok) {
      message.innerHTML = '<div style="color: green; font-weight: bold; text-align: center;">✓ Registered Successfully</div>';
      setTimeout(() => window.location.href = "login.html", 2000);
    } else {
      message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Registration failed") + '</div>';
    }
  } catch (error) {
    console.error(error);
    message.innerHTML = '<div style="color: red; text-align: center;">Server not responding.</div>';
  }
});
</script>

</body>
</html>
