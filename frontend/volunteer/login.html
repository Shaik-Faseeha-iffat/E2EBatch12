<!DOCTYPE html>
<html>
<head>
  <title>Volunteer Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="overlay"></div>

<div class="auth-container">
  <h2>Volunteer Login</h2>

  <form id="loginForm">
    <input type="email" placeholder="Email" id="email" required>
    <input type="password" placeholder="Password" id="password" required>
    <button type="submit">Login</button>
  </form>

  <div id="message"></div>

  <p><a href="forgot-password.html">Forgot Password?</a></p>
  <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
    const res = await fetch("https://foodconnect3.onrender.com/api/volunteer/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.token) {
      message.innerHTML = '<div style="color: green; font-weight: bold; text-align: center;">✓ Login Successful</div>';
      localStorage.setItem("token", data.token);
      setTimeout(() => window.location.href = "dashboard.html", 2000);
    } else {
      message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Login failed") + '</div>';
    }
  } catch (error) {
    console.error(error);
    message.innerHTML = '<div style="color: red; text-align: center;">Server not responding.</div>';
  }
});
</script>

</body>
</html>
