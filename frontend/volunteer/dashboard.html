<!DOCTYPE html>
<html>
<head>
  <title>Volunteer Dashboard - FoodConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<div class="dashboard-wrapper">

  <div class="dashboard-header">
    <h2>Volunteer Dashboard <span id="requestBadge" class="notification-badge">0</span></h2>
    <button class="dashboard-header-logout" onclick="logout()">Logout</button>
  </div>

  <div id="volunteerNotification" class="notification-banner">
    <strong>🔔 Quick Alert:</strong>
    <span id="notificationText">Approved food requests will appear here automatically for faster pickup.</span>
  </div>

  <div class="dashboard-content">

    <!-- Available Requests Card -->
    <div class="card">
      <h3>Available Food Requests</h3>
      <input type="text" id="searchLocation" placeholder="Search by location..." style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
      <div id="availableRequests" class="request-list">
        <p>Loading available requests...</p>
      </div>
    </div>

    <!-- My Deliveries Card -->
    <div class="card">
      <h3>My Deliveries</h3>
      <div id="myDeliveries" class="request-list">
        <p>Loading your deliveries...</p>
      </div>
    </div>

  </div>

  <p id="message" style="color: green; margin-top: 20px; text-align: center;"></p>

</div>

<script>

// ================= AUTH CHECK =================

const token = localStorage.getItem("token");
let previousApprovedRequestIds = new Set();
let isFirstAvailableFetch = true;
let allRequests = [];

if(!token){
  window.location.href = "login.html";
}

requestNotificationPermission();

function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}

function updateNotificationBanner(message, type = "info") {
  const banner = document.getElementById("volunteerNotification");
  const text = document.getElementById("notificationText");

  text.innerText = message;
  banner.className = `notification-banner ${type}`;
}

function notifyApprovedRequests(requests, isInitialLoad = false) {
  const requestBadge = document.getElementById("requestBadge");
  const currentIds = new Set((requests || []).map(req => req._id));
  const newRequests = (requests || []).filter(req => !previousApprovedRequestIds.has(req._id));

  requestBadge.innerText = currentIds.size;

  if (!requests || requests.length === 0) {
    updateNotificationBanner("No approved food requests right now. New requests will appear here automatically.", "info");
    previousApprovedRequestIds = currentIds;
    return;
  }

  if (!isInitialLoad && newRequests.length > 0) {
    const latest = newRequests[0];
    updateNotificationBanner(`${newRequests.length} new approved food request(s) received. Please check and collect quickly.`, "success");

    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("FoodConnect Alert", {
        body: `${newRequests.length} new approved food request(s) available${latest?.location ? ` near ${latest.location}` : ""}.`
      });
    }
  } else {
    updateNotificationBanner(`${requests.length} approved food request(s) are ready for volunteer pickup.`, "info");
  }

  previousApprovedRequestIds = currentIds;
}

// ================= FETCH AVAILABLE REQUESTS =================

async function fetchAvailableRequests() {
  try {
    const response = await fetch("https://foodconnect3.onrender.com/api/volunteer/approved-requests", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const requests = await response.json();
    allRequests = Array.isArray(requests) ? requests : [];

    if (allRequests.length === 0) {
      notifyApprovedRequests([], isFirstAvailableFetch);
      isFirstAvailableFetch = false;
      filterAndDisplayRequests();
      return;
    }

    notifyApprovedRequests(allRequests, isFirstAvailableFetch);
    isFirstAvailableFetch = false;

    filterAndDisplayRequests();
  } catch (error) {
    console.error("Error fetching requests:", error);
    document.getElementById("availableRequests").innerHTML = "<p>Error loading requests.</p>";
    updateNotificationBanner("Unable to fetch approved requests right now. Please refresh again shortly.", "error");
  }
}

// ================= FILTER AND DISPLAY REQUESTS =================

function filterAndDisplayRequests() {
  const searchValue = document.getElementById("searchLocation").value.toLowerCase();
  const filtered = allRequests.filter(req => req.location.toLowerCase().includes(searchValue));
  displayRequests(filtered);
}

function displayRequests(requests) {
  const container = document.getElementById("availableRequests");

  if (!Array.isArray(requests) || requests.length === 0) {
    container.innerHTML = "<p>No available requests at the moment.</p>";
    return;
  }

  container.innerHTML = "";
  requests.forEach(req => {
    const div = document.createElement("div");
    div.className = "request-item";
    div.innerHTML = `
      <p><strong>Food:</strong> ${req.foodType}</p>
      <p><strong>Quantity:</strong> ${req.quantity}</p>
      <p><strong>Location:</strong> ${req.location}</p>
      <p><strong>Requester:</strong> ${req.userId ? req.userId.username : 'Unknown'} (${req.userId ? req.userId.mobile : 'N/A'})</p>
      <p><strong>Submitted:</strong> ${new Date(req.createdAt).toLocaleDateString()}</p>
      <button class='secondary-btn' onclick='acceptRequest("${req._id}")'>Accept Request</button>
    `;
    container.appendChild(div);
  });
}

// ================= FETCH MY DELIVERIES =================

async function fetchMyDeliveries() {
  try {
    const response = await fetch("http://localhost:5000/api/volunteer/my-deliveries", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const requests = await response.json();
    const container = document.getElementById("myDeliveries");

    if (!Array.isArray(requests) || requests.length === 0) {
      container.innerHTML = "<p>No deliveries assigned yet.</p>";
      return;
    }

    container.innerHTML = "";
    requests.forEach(req => {
      const div = document.createElement("div");
      div.className = "request-item";
      div.innerHTML = `
        <p><strong>Food:</strong> ${req.foodType}</p>
        <p><strong>Quantity:</strong> ${req.quantity}</p>
        <p><strong>Location:</strong> ${req.location}</p>
        <p><strong>Requester:</strong> ${req.userId ? req.userId.username : 'Unknown'} (${req.userId ? req.userId.mobile : 'N/A'})</p>
        <p><strong>Status:</strong> <span class="status ${req.status === 'delivered' ? 'approved' : 'pending'}">${req.status === 'delivered' ? 'Delivered' : 'In Progress'}</span></p>
        <p><strong>Accepted:</strong> ${new Date(req.createdAt).toLocaleDateString()}</p>
        ${req.status === 'accepted' ? `<button class='secondary-btn' onclick='markDelivered("${req._id}")'>Mark as Delivered</button>` : ''}
      `;
      container.appendChild(div);
    });
  } catch (error) {
    console.error("Error fetching deliveries:", error);
    document.getElementById("myDeliveries").innerHTML = "<p>Error loading deliveries.</p>";
  }
}

// ================= ACCEPT REQUEST =================

async function acceptRequest(id) {
  try {
    const response = await fetch(`http://localhost:5000/api/volunteer/accept-request/${id}`, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await response.json();
    const msgElement = document.getElementById("message");
    msgElement.innerText = data.message;
    msgElement.style.color = response.ok ? "green" : "red";

    if (response.ok) {
      fetchAvailableRequests();
      fetchMyDeliveries();
    }
  } catch (error) {
    console.error("Error accepting request:", error);
    document.getElementById("message").innerText = "Error accepting request";
    document.getElementById("message").style.color = "red";
  }
}

// ================= MARK AS DELIVERED =================

async function markDelivered(id) {
  try {
    const response = await fetch(`http://localhost:5000/api/volunteer/mark-delivered/${id}`, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await response.json();
    const msgElement = document.getElementById("message");
    msgElement.innerText = data.message;
    msgElement.style.color = response.ok ? "green" : "red";

    if (response.ok) {
      fetchMyDeliveries();
    }
  } catch (error) {
    console.error("Error marking as delivered:", error);
    document.getElementById("message").innerText = "Error updating delivery status";
    document.getElementById("message").style.color = "red";
  }
}

// ================= LOGOUT =================

function logout(){
  localStorage.removeItem("token");
  window.location.replace("../index.html");
}

// ================= INITIALIZE =================

fetchAvailableRequests();
fetchMyDeliveries();

document.getElementById("searchLocation").addEventListener("input", filterAndDisplayRequests);

setInterval(() => {
  fetchAvailableRequests();
  fetchMyDeliveries();
}, 30000);

</script>

</body>
</html>
