<!DOCTYPE html>
<html>

<head>
  <title>Admin Login - FoodConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-body">

<div class="overlay"></div>

  <div class="auth-container">
    <h2>Admin Login</h2>

    <form id="adminLoginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const response = await fetch("https://foodconnect-ecqk.onrender.com/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        })
      });

      const data = await response.json();

      if (data.token) {
        const message = document.getElementById("message");
        message.innerHTML = '<div style="color: green; font-weight: bold; text-align: center;">✓ Login Successful</div>';
        localStorage.setItem("token", data.token);
        setTimeout(() => window.location.href = "dashboard.html", 2000);
      } else {
        const message = document.getElementById("message");
        message.innerHTML = '<div style="color: red; text-align: center;">' + data.message + '</div>';
      }
    });
  </script>

</body>

</html>
