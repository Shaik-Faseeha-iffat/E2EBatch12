<!DOCTYPE html>
<html>
<head>
  <title>FoodConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo-area">
    <div class="main-logo">FoodConnect</div>
    <div class="sub-title">Smart Food Redistribution System</div>
  </div>

  <nav class="navbar-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="impact.html">Impact</a>
    <button onclick="logout()" class="navbar-logout-btn" id="logoutBtn" style="display:none;">
      <span>Logout</span>
    </button>
  </nav>
</header>

<!-- HERO SECTION -->
<section class="hero">

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Simple Scrolling Quotes -->
  <div class="quote-bar">
    <div class="quote-track">
      Donate responsibly&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;
Reduce food waste&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;
Support communities&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;
Every meal matters&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;
Together we fight hunger&nbsp;&nbsp;&nbsp;&nbsp;•
    </div>
  </div>

  <!-- Center Content -->
  <div class="hero-content">
    <h1 class="hero-brand">Food<span>Connect</span></h1>

    <div class="role-buttons">
      <a href="user/login.html">User</a>
      <a href="volunteer/login.html">Volunteer</a>
      <a href="admin/login.html">Admin</a>
    </div>
  </div>

</section>

<footer class="footer">
  © 2026 FoodConnect | Smart Food Redistribution System
</footer>

<script>
  // Show logout button if user is authenticated
  const token = localStorage.getItem("token");
  if (token) {
    document.getElementById("logoutBtn").style.display = "inline-flex";
  }
  
  function logout() {
    localStorage.removeItem("token");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
