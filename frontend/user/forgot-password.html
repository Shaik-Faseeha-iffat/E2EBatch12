<!DOCTYPE html>
<html>
<head>
  <title>User Forgot Password</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="overlay"></div>

  <div class="auth-container">
    <h2>Forgot Password</h2>

    <form id="forgotForm">
      <input type="text" id="identifier" placeholder="Username or Email" required>
      <button type="submit">Continue</button>
    </form>

    <div id="message"></div>
    <p><a href="login.html">Back to Login</a></p>
  </div>

  <script>
    document.getElementById("forgotForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const identifier = document.getElementById("identifier").value.trim();
      const message = document.getElementById("message");

      try {
        const response = await fetch("http://localhost:5000/api/user/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier })
        });

        const data = await response.json();

        if (response.ok && data.resetToken) {
          localStorage.setItem("userResetToken", data.resetToken);
          message.innerHTML = '<div style="color: green; text-align: center;">Verified successfully. Redirecting...</div>';
          setTimeout(() => window.location.href = "reset-password.html", 1000);
        } else {
          message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Unable to verify account") + '</div>';
        }
      } catch (error) {
        console.error(error);
        message.innerHTML = '<div style="color: red; text-align: center;">Server not responding.</div>';
      }
    });
  </script>
</body>
</html>
