<!DOCTYPE html>
<html>
<head>
  <title>User Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="overlay"></div>

<div class="auth-container">
  <h2>User Registration</h2>

  <form id="registerForm">
    <input type="text" placeholder="Username" id="username" required>
    <input type="email" placeholder="Email" id="email" required>
    <input type="text" placeholder="Mobile Number" id="mobile" required>
    <div id="mobileError" class="error-message"></div>
    <input type="password" placeholder="Password" id="password" required>
    <div id="passwordError" class="error-message"></div>
    <input type="password" placeholder="Confirm Password" id="confirmPassword" required>
    <div id="confirmPasswordError" class="error-message"></div>

    <button type="submit">Register</button>
  </form>

  <div id="message"></div>

  <p>Already have an account?
    <a href="login.html">Login</a>
  </p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  // Clear previous error messages
  document.getElementById("mobileError").textContent = "";
  document.getElementById("passwordError").textContent = "";
  document.getElementById("confirmPasswordError").textContent = "";

  // Validate mobile number - exactly 10 digits
  if (!/^\d{10}$/.test(mobile)) {
    document.getElementById("mobileError").textContent = "❌ Mobile number must be exactly 10 digits!";
    return;
  }

  // Validate password - minimum 6 characters and at least one special character
  if (password.length < 6) {
    document.getElementById("passwordError").textContent = "❌ Password must be at least 6 characters long!";
    return;
  }

  if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]/.test(password)) {
    document.getElementById("passwordError").textContent = "❌ Password must contain at least one special character!";
    return;
  }

  if (password !== confirmPassword) {
    document.getElementById("confirmPasswordError").textContent = "❌ Passwords do not match!";
    return;
  }

  try {
    const response = await fetch("https://foodconnect3.onrender.com/api/user/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        email,
        mobile,
        password,
        confirmPassword
      })
    });

    const data = await response.json();

    if (response.status === 200) {
      message.innerHTML = '<div style="color: green; font-weight: bold; text-align: center;">✓ Registered Successfully</div>';
      setTimeout(() => window.location.replace("login.html"), 2000);
    } else {
      message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Registration failed") + '</div>';
    }
  } catch (error) {
    console.error(error);
    message.innerHTML = '<div style="color: red; text-align: center;">Server not responding.</div>';
  }
});
</script>

</body>
</html>
