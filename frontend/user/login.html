<!DOCTYPE html>
<html>
<head>
  <title>User Login - FoodConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="overlay"></div>

<div class="auth-container">
  <h2>User Login</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <div id="message"></div>

  <p><a href="forgot-password.html">Forgot Password?</a></p>
  <p>Don't have an account?
    <a href="register.html">Register</a>
  </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
    const response = await fetch("https://foodconnect3.onrender.com/api/user/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (response.status === 200 && data.token) {
      message.innerHTML = '<div style="color: green; font-weight: bold; text-align: center;">✓ Login Successful</div>';
      localStorage.setItem("token", data.token);
      setTimeout(() => window.location.href = "dashboard.html", 2000);
    } else {
      message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Login failed") + '</div>';
    }
  } catch (error) {
    console.error(error);
    message.innerHTML = '<div style="color: red; text-align: center;">Server error. Try again.</div>';
  }
});
</script>

</body>
</html>
