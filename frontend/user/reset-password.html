<!DOCTYPE html>
<html>
<head>
  <title>User Reset Password</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="overlay"></div>

  <div class="auth-container">
    <h2>Reset Password</h2>

    <form id="resetForm">
      <input type="password" id="password" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit">Reset Password</button>
    </form>

    <div id="message"></div>
    <p><a href="login.html">Back to Login</a></p>
  </div>

  <script>
    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const token = localStorage.getItem("userResetToken");
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (!token) {
        message.innerHTML = '<div style="color: red; text-align: center;">Reset session expired. Please try again.</div>';
        return;
      }

      if (password !== confirmPassword) {
        message.innerHTML = '<div style="color: red; text-align: center;">Passwords do not match</div>';
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/api/user/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password, confirmPassword })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.removeItem("userResetToken");
          message.innerHTML = '<div style="color: green; text-align: center;">Password reset successful. Redirecting to login...</div>';
          setTimeout(() => window.location.href = "login.html", 1500);
        } else {
          message.innerHTML = '<div style="color: red; text-align: center;">' + (data.message || "Reset failed") + '</div>';
        }
      } catch (error) {
        console.error(error);
        message.innerHTML = '<div style="color: red; text-align: center;">Server not responding.</div>';
      }
    });
  </script>
</body>
</html>
